[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-downloader"
version = "7.3.0"
description = "Downloader de arquivos do Telegram com painel interativo no terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8,<9",
    "telethon>=1.44,<1.45",
    "cryptg>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tg-downloader = "tg_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tg_downloader = ["*.tcss", "assets/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
