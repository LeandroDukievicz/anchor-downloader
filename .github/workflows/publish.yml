name: publish

# Publica no PyPI quando uma release é publicada no GitHub.
#
# Fica inerte até o repositório ter a variável PYPI_READY=true: assim ninguém
# leva erro de workflow por publicar uma release antes de o PyPI estar
# configurado. Para ligar:
#   1. criar o projeto `tg-downloader` no PyPI;
#   2. em Trusted Publishers, apontar para este repositório, o workflow
#      `publish.yml` e o ambiente `pypi`;
#   3. definir a variável de repositório PYPI_READY como `true`.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Empacotar
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: vars.PYPI_READY == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: sem token guardado no repositório
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
