name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testes
        run: pytest

      - name: Lint (imports mortos)
        run: pyflakes src tests

  # A promessa "instala com um comando" só vale verificada: instala pelo pipx,
  # num ambiente limpo, e confere que o comando existe e responde sem abrir a
  # TUI. O `--doctor` é o caminho certo para isso: ele não conecta no Telegram.
  pipx:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar com pipx
        run: |
          python -m pip install --upgrade pip pipx
          pipx install .
          pipx list

      - name: O comando roda
        run: |
          # O runner ja vem com PIPX_BIN_DIR apontando para /opt/pipx_bin, e
          # nao para ~/.local/bin. Perguntar ao proprio pipx onde ele expos o
          # comando testa a mesma coisa sem depender do padrao da maquina.
          bin_dir="$(pipx environment --value PIPX_BIN_DIR)"
          "$bin_dir/anchor-downloader" --version
          "$bin_dir/anchor-downloader" --doctor
